[package]
name = "llm_affector"
version = "0.2.0"
edition = "2021"
authors = ["Matthew Busel"]
description = "Async Rust library and CLI that uses a second LLM call to flag hallucinations and critique code"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Mattbusel/llm_affector"
repository = "https://github.com/Mattbusel/llm_affector"
documentation = "https://docs.rs/llm_affector"
keywords = ["llm", "async", "tokio", "openai", "analysis"]
categories = ["api-bindings", "text-processing", "command-line-utilities"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
dotenv = "0.15"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "concurrent_analysis"
path = "examples/concurrent_analysis.rs"

[[example]]
name = "error_handling"
path = "examples/error_handling.rs"
